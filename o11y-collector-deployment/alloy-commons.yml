---

- name: The release commons are installed
  hosts: all
  become: true
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  tasks:
    - name: Common role tasks are being played
      ansible.builtin.include_role:
        name: alloy_commons
      vars:
        alloy_commons: "{{ item }}"
      loop:
        - utilities